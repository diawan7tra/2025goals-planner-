<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js"></script>

    <style>
        * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
       }
    
       body {
           font-family: Arial, Helvetica, sans-serif;
           background-color: #f4f4f4;
           display: flex;
           justify-content: center;
           align-items: center;
           height: 100vh;
       }
    
       .login-container {
           background-color: white;
           padding: 40px;
           border-radius: 8px;
           box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
           width: 300px;
           text-align: center;
       }
    
       .login-form h2 {
           margin-bottom: 20px;
           font-size: 24px;
           color: #333;
       }
    
       .input-group {
           margin-bottom: 15;
           text-align: left;
       }
    
       .input-group label {
           display: block;
           font-size: 14px;
           color: #333;
           margin-bottom: 5px;
           font-weight: bold;
       }
    
       .input-group input {
           width: 100%;
           padding: 10px;
           font-size: 16px;
           border: 1px solid #ddd;
           border-radius: 15px;
       }
    
       button {
           width: 100%;
           padding: 10px;
           font-size: 16px;
           background-color: #4caf50;
           color: white;
           border: none;
           border-radius: 15px;
           cursor: pointer;
           margin-top: 10px;
       }
    </style>
</head>



<body>
    
    <div class="login-container">
        <form action="" class="login-form" id="loginForm">
            <h2>Login Page</h2> 
            <div class="input-group">
                <label for="username">Username</label>
                <input type="email" id="username" name="username" placeholder="Masukan Email / Username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukan Password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>


    <!-- JavaS Start -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries
      
        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyB5T2ovKf7HwS986J4WwEfxyXVJMWvqb5w",
            authDomain: "st-prject-33beb.firebaseapp.com",
            projectId: "st-prject-33beb",
            storageBucket: "st-prject-33beb.firebasestorage.app",
            messagingSenderId: "100244638523",
            appId: "1:100244638523:web:bee67a40f3e81fd9a9451e",
            measurementId: "G-KGL7SCPF58"
        };
      
        // Initialize Firebase
        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        //
        const loginForm     = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username" );
        const passwordInput = document.getElementById("password" );

        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const email    = usernameInput.value;
            const password = passwordInput.value;

            signInWithEmailAndPassword(auth, email, password).then((userCredential) => {
                const user = userCredential.user;
                // alert("Login Successful" + user.email );
                window.location.href = "planner.html";
            }).catch((error) => {
                alert("Error " + error.message);
            });
        });
        
      </script>
    <!-- JavaS End -->

    
</body>
</html>
